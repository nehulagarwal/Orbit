name: chat_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Firebase Core
  firebase_core: ^4.7.0

  # Firebase Authentication
  firebase_auth: ^6.2.0

  # Google Sign In
  google_sign_in: ^7.2.0

  # Cloud Firestore
  cloud_firestore: ^6.1.3

  # Network Image Caching
  cached_network_image: ^3.4.1

  # Image Picker
  image_picker: ^1.2.1



  # Firebase Storage
  firebase_storage: ^13.1.0

  # Emoji Picker
  emoji_picker_flutter: ^4.4.0

  # Firebase Cloud Messaging (Push Notifications)
  firebase_messaging: ^16.1.1

  # Bearer Token for Push Notifications
  googleapis_auth: ^2.0.0

  # REST API Calls
  http: ^1.6.0

  # Notification Channel
  flutter_notification_channel: ^3.1.1

  # Save Images to Gallery
  gallery_saver_plus: ^3.2.9

  # Lottie Animations
  lottie: ^3.3.2

  # Google Gemini AI
  google_generative_ai: ^0.4.7

  # Date Time Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1

  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main com.yourname.chat_app

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/Orbit_icon.png"
    remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/